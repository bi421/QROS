---
name: Production Schema Parity Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-parity:
    name: Production Schema / Migration Parity
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # This gate is intentionally manual because production credentials are
      # environment-scoped secrets and are not present in the repository.
      # It must only be dispatched after the production environment has:
      # SUPABASE_ACCESS_TOKEN, PRODUCTION_DB_PASSWORD, PRODUCTION_PROJECT_ID.
      - name: Validate required production secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "::error::SUPABASE_ACCESS_TOKEN is not configured"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD}" || { echo "::error::PRODUCTION_DB_PASSWORD is not configured"; exit 1; }
          test -n "${SUPABASE_PROJECT_ID}" || { echo "::error::PRODUCTION_PROJECT_ID is not configured"; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        run: supabase link --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Run production schema parity checks
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        run: bash scripts/ci/production_schema_parity.sh
