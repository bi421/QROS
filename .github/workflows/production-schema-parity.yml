name: Production Schema Parity

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  schema-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      
      - name: Validate migration SQL
        run: |
          set -euo pipefail
          for sql_file in supabase/migrations/*.sql; do
            [ -f "\" ] || continue
            echo "Validating: \"
            
            # Суpabase-тэй interact хийхмүүсэн суудалц
            supabase start
            supabase db query --file "\" 2>&1 | grep -q "ERROR" && exit 1
            echo "✅ OK"
          done
