name: Production Schema Parity Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-schema-parity.yml'
      - 'supabase/migrations/**'

jobs:
  schema-parity:
    name: Production Schema / Migration Parity
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Validate required production secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "::error::SUPABASE_ACCESS_TOKEN is not configured"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD}" || { echo "::error::PRODUCTION_DB_PASSWORD is not configured"; exit 1; }
          test -n "${SUPABASE_PROJECT_ID}" || { echo "::error::PRODUCTION_PROJECT_ID is not configured"; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        run: supabase link --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Verify migration history parity
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          # Supabase CLI renders this table for humans, and the separator may be
          # Unicode (│) or ASCII (|). Normalize before parsing so formatting
          # changes cannot silently disable the production parity gate.
          normalize_migration_rows() {
            awk '
              BEGIN { rows = 0; mismatches = 0 }
              {
                gsub(/│/, "|")
                if ($0 ~ /^[[:space:]]*[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][_-]/) {
                  n = split($0, col, "|")
                  if (n < 2) {
                    print "invalid migration row: " $0 > "/dev/stderr"
                    exit 3
                  }
                  local = col[1]
                  remote = col[2]
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", local)
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", remote)
                  rows++
                  if (local == "" || remote == "" || local != remote) {
                    mismatches++
                    printf "local=%s remote=%s\n", local, remote
                  }
                }
              }
              END {
                if (rows == 0) exit 2
                if (mismatches > 0) exit 1
                exit 0
              }
            '
          }

          # Contract-test the parser against both table formats before touching
          # production. This makes the gate fail on parser regressions rather
          # than silently accepting an unverified migration state.
          fixture_unicode="$(mktemp)"
          fixture_ascii="$(mktemp)"
          trap 'rm -f "$fixture_unicode" "$fixture_ascii"' EXIT
          cat > "$fixture_unicode" <<'EOF'
LOCAL   │ REMOTE  │ TIME
202609210001 │ 202609210001 │ 2026-09-21 00:01:00
202609210002 │ 202609210002 │ 2026-09-21 00:02:00
EOF
          cat > "$fixture_ascii" <<'EOF'
LOCAL   | REMOTE  | TIME
202609210001 | 202609210001 | 2026-09-21 00:01:00
202609210002 | 202609210002 | 2026-09-21 00:02:00
EOF
          normalize_migration_rows < "$fixture_unicode" > /dev/null
          normalize_migration_rows < "$fixture_ascii" > /dev/null

          output="$(supabase migration list --linked 2>&1)"
          printf '%s\n' "$output"

          if normalize_migration_rows <<<"$output" > /tmp/qros-migration-parity.txt; then
            :
          else
            status=$?
            if [ "$status" -eq 2 ]; then
              echo "::error::Supabase migration list contained no parseable migration rows."
            elif [ "$status" -eq 1 ]; then
              echo "::error::Production and repository migration histories differ."
              cat /tmp/qros-migration-parity.txt
            else
              echo "::error::Supabase migration list format could not be parsed safely."
              cat /tmp/qros-migration-parity.txt || true
            fi
            exit 1
          fi

          echo "Production and repository migration histories are aligned with exact local/remote version equality."

      - name: Verify db push dry-run is executable and non-destructive
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run

      - name: Verify required production objects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          sql=$(cat <<'SQL'
do $$
begin
  if to_regclass('public.research_claim') is null then
    raise exception 'required object missing: public.research_claim';
  end if;
  if to_regclass('public.audit_event') is null then
    raise exception 'required object missing: public.audit_event';
  end if;
  if to_regclass('public.retention_deletion_operation') is null then
    raise exception 'required object missing: public.retention_deletion_operation';
  end if;
end
$$;
SQL
)
          supabase db query --linked "$sql"

      - name: Verify public tenant tables remain RLS protected
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          sql=$(cat <<'SQL'
do $$
declare
  missing_rls text;
begin
  select string_agg(format('%I.%I', n.nspname, c.relname), ', ' order by c.relname)
    into missing_rls
  from pg_class c
  join pg_namespace n on n.oid = c.relnamespace
  where n.nspname = 'public'
    and c.relkind = 'r'
    and c.relname in (
      'workspace','workspace_member','dataset','dataset_version',
      'research_run','artifact','evidence','research_claim',
      'audit_event','retention_deletion_operation'
    )
    and not c.relrowsecurity;
  if missing_rls is not null then
    raise exception 'RLS disabled on required tables: %', missing_rls;
  end if;
end
$$;
SQL
)
          supabase db query --linked "$sql"
