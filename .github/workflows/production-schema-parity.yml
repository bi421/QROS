name: Production Schema Parity Gate

on:
  workflow_dispatch:

jobs:
  schema-parity:
    name: Production Schema / Migration Parity
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate required production secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "::error::SUPABASE_ACCESS_TOKEN is not configured"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD}" || { echo "::error::PRODUCTION_DB_PASSWORD is not configured"; exit 1; }
          test -n "${SUPABASE_PROJECT_ID}" || { echo "::error::PRODUCTION_PROJECT_ID is not configured"; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Verify migration history parity
        run: |
          set -euo pipefail
          supabase migration list --linked

      - name: Verify no pending migrations
        run: |
          set -euo pipefail
          output="$(supabase db push --linked --dry-run 2>&1)"
          printf '%s\n' "$output"
          if grep -q "Would push" <<<"$output"; then
            echo "::error::Production has unapplied repository migrations."
            exit 1
          fi
          if grep -q "Linked project is up to date" <<<"$output"; then
            exit 0
          fi
          echo "::error::Could not prove production migration parity from db push --dry-run output."
          exit 1

      - name: Verify required production objects
        run: |
          set -euo pipefail
          result="$(supabase db query --linked "select to_regclass('public.research_claim') as research_claim, to_regclass('public.audit_event') as audit_event, to_regclass('public.retention_deletion_operation') as retention_deletion_operation;" 2>&1)"
          printf '%s\n' "$result"
          grep -q "research_claim" <<<"$result" || { echo "::error::research_claim is missing"; exit 1; }
          grep -q "audit_event" <<<"$result" || { echo "::error::audit_event is missing"; exit 1; }
          grep -q "retention_deletion_operation" <<<"$result" || { echo "::error::retention_deletion_operation is missing"; exit 1; }

      - name: Verify public tenant tables remain RLS protected
        run: |
          set -euo pipefail
          supabase db query --linked "select c.relname from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and c.relname in ('workspace','workspace_member','dataset','dataset_version','research_run','artifact','evidence','research_claim','audit_event','retention_deletion_operation') and not c.relrowsecurity order by c.relname;" | tee /tmp/rls.txt
          if grep -Eq 'workspace|workspace_member|dataset|dataset_version|research_run|artifact|evidence|research_claim|audit_event|retention_deletion_operation' /tmp/rls.txt; then
            echo "::error::One or more required tenant/server tables have RLS disabled."
            exit 1
          fi
