name: Production Schema Parity Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-schema-parity.yml'
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  schema-parity:
    name: Production Schema / Migration Parity
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Validate required production secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "::error::SUPABASE_ACCESS_TOKEN is not configured"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD}" || { echo "::error::PRODUCTION_DB_PASSWORD is not configured"; exit 1; }
          test -n "${SUPABASE_PROJECT_ID}" || { echo "::error::PRODUCTION_PROJECT_ID is not configured"; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Verify migration history parity
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          output="$(supabase migration list --linked 2>&1)"
          printf '%s\n' "${output}"

          python3 - "${output}" <<'PY'
import sys
text = sys.argv[1]
rows = []
for raw in text.splitlines():
    line = raw.replace("│", "|").strip()
    if not line or not line[:8].isdigit() or line[8:9] not in "_-":
        continue
    cols = [part.strip() for part in line.split("|")]
    if len(cols) < 2:
        raise SystemExit("::error::Supabase migration list format could not be parsed safely.")
    local, remote = cols[0], cols[1]
    rows.append((local, remote))
if not rows:
    raise SystemExit("::error::Supabase migration list contained no parseable migration rows.")
mismatches = [(local, remote) for local, remote in rows if not local or not remote or local != remote]
if mismatches:
    for local, remote in mismatches:
        print(f"local={local} remote={remote}")
    raise SystemExit("::error::Production and repository migration histories differ.")
print(f"Verified {len(rows)} migration version rows with exact local/remote equality.")
PY

      - name: Verify db push dry-run is non-destructive
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run

      - name: Verify required production objects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          sql=$(cat <<'SQL'
do $$
begin
  if to_regclass('public.research_claim') is null then
    raise exception 'required object missing: public.research_claim';
  end if;
  if to_regclass('public.audit_event') is null then
    raise exception 'required object missing: public.audit_event';
  end if;
  if to_regclass('public.retention_deletion_operation') is null then
    raise exception 'required object missing: public.retention_deletion_operation';
  end if;
end
$$;
SQL
)
          supabase db query --linked "${sql}"

      - name: Verify public tenant tables remain RLS protected
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          sql=$(cat <<'SQL'
do $$
declare
  missing_rls text;
begin
  select string_agg(format('%I.%I', n.nspname, c.relname), ', ' order by c.relname)
    into missing_rls
  from pg_class c
  join pg_namespace n on n.oid = c.relnamespace
  where n.nspname = 'public'
    and c.relkind = 'r'
    and c.relname in (
      'workspace','workspace_member','dataset','dataset_version',
      'research_run','artifact','evidence','research_claim',
      'audit_event','retention_deletion_operation'
    )
    and not c.relrowsecurity;
  if missing_rls is not null then
    raise exception 'RLS disabled on required tables: %', missing_rls;
  end if;
end
$$;
SQL
)
          supabase db query --linked "${sql}"
