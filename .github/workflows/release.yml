name: Exact Release Gate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact immutable commit SHA to release
        required: true
        type: string
      version:
        description: Semantic release version without the leading v
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: exact-release-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Exact SHA Production Health Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Assert exact commit
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "EXACT_RELEASE_SHA=$actual" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest pytest-cov ruff
          python -m pip install -e ".[dev,test,saas]"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Start isolated Supabase for RLS verification
        run: |
          set -euo pipefail
          supabase start

      - name: Verify production backup integrity
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_AWS_REGION }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$AWS_DEFAULT_REGION"
          test -n "$BACKUP_S3_BUCKET"
          mkdir -p .health/backup
          latest_key="$(aws s3api list-objects-v2 --bucket "$BACKUP_S3_BUCKET" --prefix qros/postgres/ --query 'Contents[].Key' --output text | tr '\\t' '\\n' | grep '\\.dump$' | sort | tail -n 1)"
          test -n "$latest_key"
          test "$latest_key" != "None"
          sha_key="${latest_key%.dump}.sha256"
          aws s3api head-object --bucket "$BACKUP_S3_BUCKET" --key "$latest_key" >/dev/null
          aws s3api head-object --bucket "$BACKUP_S3_BUCKET" --key "$sha_key" >/dev/null
          aws s3 cp "s3://$BACKUP_S3_BUCKET/$latest_key" .health/backup/latest.dump --only-show-errors
          aws s3 cp "s3://$BACKUP_S3_BUCKET/$sha_key" .health/backup/latest.sha256 --only-show-errors
          checksum="$(awk '{print $1}' .health/backup/latest.sha256)"
          printf "%s  .health/backup/latest.dump\\n" "$checksum" > .health/backup/latest.sha256
          sha256sum --check .health/backup/latest.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          Path(".health/backup_verify.json").write_text(
              json.dumps({
                  "label": "backup_verify_contract",
                  "status": "PASS",
                  "returncode": 0,
                  "command": ["aws s3api head-object", "sha256sum --check"],
                  "stdout": "remote backup object and checksum verified",
                  "stderr": "",
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run exact release health gate
        env:
          GITHUB_SHA: ${{ inputs.commit_sha }}
          PYTHONPATH: researchos/engines/quant/python
        run: |
          set -euo pipefail
          python scripts/final_health_check.py --commit "$GITHUB_SHA"

      - name: Build Docker image with exact commit label
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          docker build --label "commit=$RELEASE_SHA" -t "qros-api:$RELEASE_SHA" .
          actual="$(docker inspect --format='{{ index .Config.Labels "commit" }}' "qros-api:$RELEASE_SHA")"
          test "$actual" = "$RELEASE_SHA"

      - name: Validate immutable health evidence
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          evidence="health_evidence_$RELEASE_SHA.json"
          test -s "$evidence"
          python - "$evidence" "$RELEASE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          expected = sys.argv[2]
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["commit"] == expected
          assert data["health_status"] == "PASS"
          required = {
              "pytest",
              "red_team_tenant_isolation",
              "rls_tenant_isolation",
              "authz_matrix",
              "backup_verify_contract",
          }
          assert required.issubset(data["checks"])
          assert all(data["checks"][name]["status"] == "PASS" for name in required)
          assert data["coverage"]["status"] == "PASS"
          PY

      - name: Upload exact health evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: health-evidence-${{ inputs.commit_sha }}
          path: health_evidence_${{ inputs.commit_sha }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop

      - name: Tag release only after green health evidence
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="health_evidence_$RELEASE_SHA.json"
          test -s "$evidence"
          test "$(python - "$evidence" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["health_status"])
          PY
          )" = "PASS"
          case "$VERSION" in
            ''|*[!0-9.]*|.*|*.) exit 1 ;;
          esac
          tag="v$VERSION"
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::release tag $tag already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$RELEASE_SHA" -m "Release $tag from green health evidence $RELEASE_SHA"
          git push origin "$tag"
