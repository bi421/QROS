name: Exact Release Gate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact 40-character commit SHA to validate"
        required: true
        type: string
      release_tag:
        description: "Optional release tag; created only after the exact SHA is green"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: exact-release-${{ inputs.commit_sha || github.sha }}
  cancel-in-progress: false

jobs:
  health-gate:
    name: Exact SHA Production Health Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ inputs.commit_sha || github.sha }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Assert exact commit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$RELEASE_SHA"
          test "${#RELEASE_SHA}" -eq 40
          echo "Exact release SHA: $actual"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client ninja-build cmake g++

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest pytest-cov ruff nanobind scikit-build-core cmake -e ".[dev,test,saas]"

      - name: Start isolated Supabase database
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start local Supabase
        run: |
          supabase init
          supabase start

      - name: Build canonical C++ backend
        run: |
          set -euo pipefail
          cmake -S researchos/engines/quant -B researchos/engines/quant/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=ON
          cmake --build researchos/engines/quant/build -j

      - name: Build exact-commit Docker image
        run: |
          set -euo pipefail
          docker build --label "commit=$RELEASE_SHA" -t "qros-api:$RELEASE_SHA" .
          actual="$(docker inspect --format='{{ index .Config.Labels "commit" }}' "qros-api:$RELEASE_SHA")"
          test "$actual" = "$RELEASE_SHA"

      - name: Prepare object replication fixture
        run: |
          set -euo pipefail
          mkdir -p .dr-objects/before/datasets .dr-objects/after/datasets
          printf '%s' 'qros-exact-release-fixture' > .dr-objects/before/datasets/sample.csv
          cp .dr-objects/before/datasets/sample.csv .dr-objects/after/datasets/sample.csv

      - name: Run exact-release health gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          TARGET_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          python scripts/final_health_check.py \
            --expected-commit "$RELEASE_SHA" \
            --database-url "$DATABASE_URL" \
            --backup-source-url "$DATABASE_URL" \
            --backup-target-admin-url "$TARGET_ADMIN_URL" \
            --object-root-before .dr-objects/before \
            --object-root-after .dr-objects/after

      - name: Upload immutable health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-evidence-${{ env.RELEASE_SHA }}
          path: health_evidence_${{ env.RELEASE_SHA }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Stop Supabase
        if: always()
        run: supabase stop

  release-tag:
    name: Create Release Tag From Green Evidence
    needs: [health-gate]
    if: ${{ needs.health-gate.result == 'success' && inputs.release_tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ inputs.commit_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate release tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Checkout exact green SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Require green health evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          echo "Tagging is allowed only because the exact SHA health-gate job succeeded."
          test -n "$RELEASE_SHA"

      - name: Create tag only from the exact green SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $RELEASE_TAG"
            exit 1
          fi
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
