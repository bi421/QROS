name: Exact Release Gate
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ github.ref_name }}
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Assert exact tag commit
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$head" = "$RELEASE_SHA"
          test "$tag_commit" = "$RELEASE_SHA"
      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg postgresql-common
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version
          pg_restore --version
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,saas]"
      - name: Start checked-in local Supabase project
        run: supabase start
      - name: Run exact release health gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dr-objects/before .dr-objects/after
          printf 'QROS DR fixture\n' > .dr-objects/before/object.txt
          cp .dr-objects/before/object.txt .dr-objects/after/object.txt
          python scripts/final_health_check.py \
            --expected-commit "$RELEASE_SHA" \
            --db-url "$DATABASE_URL" \
            --source-db-url "$DATABASE_URL" \
            --admin-db-url "$DATABASE_URL" \
            --object-before .dr-objects/before \
            --object-after .dr-objects/after
      - name: Require exact health evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence=".health/health_evidence_$RELEASE_SHA.json"
          test -f "$evidence"
          python - "$evidence" "$RELEASE_SHA" <<'PY'
          import json, sys
          path, expected = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              data = json.load(handle)
          assert data["commit"] == expected
          assert data["tests_passed"] is True
          assert data["health_status"] == "PASS"
          for key in ("rls_check", "authz_check", "tenant_isolation_check"):
              assert data[key] is True, key
          PY
      - name: Verify Docker revision labels
        run: |
          docker build --label "org.opencontainers.image.revision=$RELEASE_SHA" --label "commit=$RELEASE_SHA" -t "qros-release:$RELEASE_SHA" .
          docker inspect "qros-release:$RELEASE_SHA" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' | grep -Fx "$RELEASE_SHA"
          docker inspect "qros-release:$RELEASE_SHA" --format '{{index .Config.Labels "commit"}}' | grep -Fx "$RELEASE_SHA"
      - name: Upload health evidence
        uses: actions/upload-artifact@v4
        with:
          name: health-evidence-${{ env.RELEASE_SHA }}
          path: .health/health_evidence_${{ env.RELEASE_SHA }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub release only after all gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f ".health/health_evidence_$RELEASE_SHA.json"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes ".health/health_evidence_$RELEASE_SHA.json"
      - name: Stop local Supabase
        if: always()
        run: supabase stop
