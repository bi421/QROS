name: Supabase Database Security Tests

on:
  push:
    branches:
      - main
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: qros-supabase-db-tests-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  tenant-isolation:
    name: Tenant Isolation (pgTAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.117.0
          github-token: ${{ github.token }}

      - name: Ensure Supabase config exists
        run: |
          if [ ! -f supabase/config.toml ]; then supabase init; fi

      - name: Isolate local database port
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("supabase/config.toml")
          text = path.read_text(encoding="utf-8")
          marker = "port = 54322"
          if marker not in text:
              raise SystemExit("Expected generated Supabase db port declaration was not found")
          path.write_text(text.replace(marker, "port = 54332", 1), encoding="utf-8")
          PY

      - name: Start local Supabase
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Starting local Supabase (attempt $attempt/$max_attempts)"
            if supabase start; then
              echo "Local Supabase started successfully."
              exit 0
            fi
            echo "::warning::supabase start failed on attempt $attempt/$max_attempts; retrying after registry backoff"
            supabase stop || true
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep_seconds=$((30 * attempt))
              echo "Sleeping ${sleep_seconds}s before retry."
              sleep "$sleep_seconds"
            fi
          done

      - name: Install pgtap extension
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54332 -U postgres -d postgres -c "create extension if not exists pgtap;" || true
          echo "::error::Unable to start local Supabase after $max_attempts attempts."
          exit 1

      - name: Run database security tests
        run: supabase test db supabase/tests/tenant_isolation_test.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop


