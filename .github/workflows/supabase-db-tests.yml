name: Supabase Database Security Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: qros-supabase-db-tests-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  tenant-isolation:
    name: Tenant Isolation (pgTAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Initialize local Supabase configuration
        run: supabase init

      - name: Isolate local database port
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("supabase/config.toml")
          text = path.read_text(encoding="utf-8")
          marker = "port = 54322"
          if marker not in text:
              raise SystemExit("Expected generated Supabase db port declaration was not found")
          path.write_text(text.replace(marker, "port = 54332", 1), encoding="utf-8")
          PY

      - name: Start local Supabase
        run: supabase start

      - name: Run database security tests
        run: supabase test db supabase/tests/tenant_isolation_test.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop
