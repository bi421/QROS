name: Strict Production Mypy Diagnostic v35

on:
  pull_request:
    paths:
      - 'researchos/**'
      - '.github/workflows/mypy-production-strict-v35.yml'

jobs:
  mypy-strict-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Run strict production Mypy
        run: |
          cat > /tmp/mypy-production-strict-v35.ini <<'EOF'
[mypy]
python_version = 3.12
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
warn_no_return = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
strict_equality = true
exclude = (^|/)(tests|archive|build-nanobind|\\.venv|venv)/
EOF
          python -m mypy researchos --config-file /tmp/mypy-production-strict-v35.ini --exclude '(^|/)tests/'
