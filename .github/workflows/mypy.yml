name: mypy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mypy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,saas]"
          python -m pip install mypy-baseline
      - name: Verify baseline synchronization
        run: |
          python -m mypy --config-file pyproject.toml --follow-imports=skip --no-incremental | mypy-baseline sync
          git diff --exit-code -- mypy-baseline.txt
