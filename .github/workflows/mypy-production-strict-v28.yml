name: Mypy Production Strict Diagnostic v28

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  mypy-production-strict-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[dev,test,saas]"
      - name: Write strict mypy config
        shell: bash
        run: |
          cat > /tmp/mypy-production-strict-v28.ini <<'EOF'
          [mypy]
          python_version = 3.12
          ignore_missing_imports = true
          warn_return_any = true
          warn_unused_ignores = true
          warn_no_return = true
          no_implicit_optional = true
          disallow_untyped_defs = true
          disallow_incomplete_defs = true
          check_untyped_defs = true
          disallow_untyped_decorators = false
          strict_equality = true
          exclude = (^|/)(tests|archive|build-nanobind|\\.venv|venv)/
          EOF
      - run: python -m mypy researchos --config-file /tmp/mypy-production-strict-v28.ini --exclude '(^|/)tests/'
