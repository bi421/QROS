name: Mypy Production Strict Diagnostic v23

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  mypy-production-strict-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[dev,test,saas]"
      - run: python -m mypy researchos --config-file .github/mypy-production-strict-v22.ini --exclude '(^|/)tests/'
