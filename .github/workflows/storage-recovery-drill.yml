---
name: Storage Recovery Drill

on:
  workflow_dispatch:
    inputs:
      object_name:
        description: "Unique drill object name"
        required: true
        default: "drills/storage-recovery-v1.bin"

permissions:
  contents: read

jobs:
  storage-recovery:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate recovery source and target identity
        env:
          SOURCE_ENVIRONMENT: ${{ secrets.QROS_BACKUP_SOURCE_ENVIRONMENT }}
          STAGING_PROJECT_REF: ${{ secrets.QROS_STAGING_SUPABASE_PROJECT_REF }}
          TARGET_ENVIRONMENT: ${{ secrets.QROS_RECOVERY_TARGET_ENVIRONMENT }}
          TARGET_ID: ${{ secrets.QROS_RECOVERY_TARGET_ID }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_ENVIRONMENT" || { echo "::error::QROS_BACKUP_SOURCE_ENVIRONMENT is required"; exit 1; }
          test -n "$STAGING_PROJECT_REF" || { echo "::error::QROS_STAGING_SUPABASE_PROJECT_REF is required"; exit 1; }
          test -n "$TARGET_ENVIRONMENT" || { echo "::error::QROS_RECOVERY_TARGET_ENVIRONMENT is required"; exit 1; }
          test -n "$TARGET_ID" || { echo "::error::QROS_RECOVERY_TARGET_ID is required"; exit 1; }
          test "$SOURCE_ENVIRONMENT" = "staging" || { echo "::error::Recovery source must be staging"; exit 1; }
          case "$SOURCE_ENVIRONMENT" in production|prod) echo "::error::Production cannot be a recovery source"; exit 1;; esac
          case "$TARGET_ENVIRONMENT" in production|prod|staging) echo "::error::Recovery target must be isolated from staging and production"; exit 1;; esac
          test "$TARGET_ID" != "$STAGING_PROJECT_REF" || { echo "::error::Recovery target identity must differ from staging project identity"; exit 1; }
          echo "Recovery source/target identity gate: PASS"
          echo "source_environment=$SOURCE_ENVIRONMENT"
          echo "recovery_target_environment=$TARGET_ENVIRONMENT"
          echo "recovery_target_id_is_distinct=true"

      - name: Validate recovery secrets
        env:
          SUPABASE_URL: ${{ secrets.QROS_STAGING_SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.QROS_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          S3_BUCKET: ${{ secrets.QROS_RECOVERY_S3_BUCKET }}
          AWS_REGION: ${{ secrets.QROS_RECOVERY_AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.QROS_RECOVERY_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.QROS_RECOVERY_AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"; test -n "$SERVICE_ROLE_KEY"; test -n "$S3_BUCKET"; test -n "$AWS_REGION"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"

      - name: Validate drill object name
        env:
          OBJECT_NAME: ${{ inputs.object_name }}
        shell: bash
        run: |
          set -euo pipefail
          case "${OBJECT_NAME}" in
            ""|/*|*..*|*\\\\*)
              echo "::error::object_name must be a non-empty relative storage key without traversal or backslashes"
              exit 1
              ;;
          esac
          case "${OBJECT_NAME}" in
            drills/*) ;;
            *) echo "::error::object_name must stay under the drills/ prefix"; exit 1 ;;
          esac

      - name: Create deterministic drill object
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path("/tmp/qros-drill.bin")
          data=b"QROS-STORAGE-RECOVERY-V1\n"+bytes(range(256))*4096
          p.write_bytes(data)
          print("source_sha256="+hashlib.sha256(data).hexdigest())
          PY
      - name: Upload object to QROS Storage
        env:
          SUPABASE_URL: ${{ secrets.QROS_STAGING_SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.QROS_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          OBJECT_NAME: ${{ inputs.object_name }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST "$SUPABASE_URL/storage/v1/object/qros-datasets/$OBJECT_NAME" -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H "apikey: $SERVICE_ROLE_KEY" -H "Content-Type: application/octet-stream" --data-binary @/tmp/qros-drill.bin
      - name: Verify QROS storage upload
        env:
          SUPABASE_URL: ${{ secrets.QROS_STAGING_SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.QROS_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          OBJECT_NAME: ${{ inputs.object_name }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$SUPABASE_URL/storage/v1/object/qros-datasets/$OBJECT_NAME" -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H "apikey: $SERVICE_ROLE_KEY" -o /tmp/qros-storage-source.bin
          cmp /tmp/qros-drill.bin /tmp/qros-storage-source.bin

      - name: Export independent recovery copy
        env:
          AWS_REGION: ${{ secrets.QROS_RECOVERY_AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.QROS_RECOVERY_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.QROS_RECOVERY_AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.QROS_RECOVERY_S3_BUCKET }}
          OBJECT_NAME: ${{ inputs.object_name }}
        run: |
          set -euo pipefail
          aws s3 cp /tmp/qros-storage-source.bin "s3://$S3_BUCKET/qros-storage-drill/$OBJECT_NAME" --region "$AWS_REGION"
          aws s3api head-object --bucket "$S3_BUCKET" --key "qros-storage-drill/$OBJECT_NAME" --region "$AWS_REGION" >/dev/null
      - name: Restore independent copy
        env:
          AWS_REGION: ${{ secrets.QROS_RECOVERY_AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.QROS_RECOVERY_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.QROS_RECOVERY_AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.QROS_RECOVERY_S3_BUCKET }}
          OBJECT_NAME: ${{ inputs.object_name }}
        run: |
          set -euo pipefail
          aws s3 cp "s3://$S3_BUCKET/qros-storage-drill/$OBJECT_NAME" /tmp/qros-recovery-copy.bin --region "$AWS_REGION"
          cp /tmp/qros-recovery-copy.bin /tmp/qros-restored.bin
      - name: Verify restored content hash
        run: |
          set -euo pipefail
          python3 ops/recovery/storage_recovery_verify.py --source /tmp/qros-drill.bin --recovery-copy /tmp/qros-recovery-copy.bin --restored /tmp/qros-restored.bin
      - name: Re-upload restored object and verify
        env:
          SUPABASE_URL: ${{ secrets.QROS_STAGING_SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.QROS_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          OBJECT_NAME: ${{ inputs.object_name }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST "$SUPABASE_URL/storage/v1/object/qros-datasets/$OBJECT_NAME?upsert=true" -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H "apikey: $SERVICE_ROLE_KEY" -H "Content-Type: application/octet-stream" --data-binary @/tmp/qros-restored.bin
          curl --fail --silent --show-error "$SUPABASE_URL/storage/v1/object/qros-datasets/$OBJECT_NAME" -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H "apikey: $SERVICE_ROLE_KEY" -o /tmp/qros-downloaded.bin
          cmp /tmp/qros-drill.bin /tmp/qros-downloaded.bin
      - name: Cleanup drill S3 object
        if: always()
        env:
          AWS_REGION: ${{ secrets.QROS_RECOVERY_AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.QROS_RECOVERY_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.QROS_RECOVERY_AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.QROS_RECOVERY_S3_BUCKET }}
          OBJECT_NAME: ${{ inputs.object_name }}
        run: |
          set -euo pipefail
          aws s3 rm "s3://$S3_BUCKET/qros-storage-drill/$OBJECT_NAME" --region "$AWS_REGION" || true
      - name: Cleanup drill object
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.QROS_STAGING_SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.QROS_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          OBJECT_NAME: ${{ inputs.object_name }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X DELETE "$SUPABASE_URL/storage/v1/object/qros-datasets/$OBJECT_NAME" -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H "apikey: $SERVICE_ROLE_KEY" || true
