---
name: Supply Chain Security

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - "uv.lock"
      - "requirements*.txt"
      - ".github/workflows/supply-chain-security.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - "uv.lock"
      - "requirements*.txt"
      - ".github/workflows/supply-chain-security.yml"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: supply-chain-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/qros

jobs:
  dependency-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[saas]"
      - name: Audit resolved Python environment
        run: |
          python -m pip install "pip-audit==2.10.1"
          python -m pip_audit --strict .

  container-audit:
    name: Container Build, Security Scan, and Provenance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build release container locally
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: qros-security:${{ github.sha }}

      - name: Scan release container
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          docker run --rm             -v /var/run/docker.sock:/var/run/docker.sock             -v "${RUNNER_TEMP}/trivy-cache:/root/.cache/"             ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9             image             --scanners vuln,secret             --vuln-type os             --severity HIGH,CRITICAL             --ignore-unfixed=false             --exit-code 1             qros-security:${{ github.sha }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable commit image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker tag "qros-security:${{ github.sha }}" "${IMAGE}"
          docker push "${IMAGE}"

      - name: Resolve immutable image digest
        if: github.event_name != 'pull_request'
        id: digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          REPO_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}")"
          DIGEST="${REPO_DIGEST##*@}"
          test "${DIGEST#sha256:}" != "${DIGEST}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${REPO_DIGEST}"

      - name: Generate container provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Publish immutable release evidence
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p supply-chain-evidence
          cat > supply-chain-evidence/release-image.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "commit_sha": "${{ github.sha }}",
            "image": "${IMAGE}",
            "image_tag": "${{ github.sha }}",
            "image_digest": "${DIGEST}",
            "immutable_reference": "${IMAGE}@${DIGEST}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "event": "${{ github.event_name }}"
          }
          EOF

      - name: Upload immutable release evidence
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-release-evidence-${{ github.sha }}
          path: supply-chain-evidence/release-image.json
          if-no-files-found: error
