---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Preserve an independent verification result for every main commit.
# New pushes must not cancel a run already executing for the same branch.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phase52-benchmark:
    name: Phase52 Performance Benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,test,saas]"
      - name: Run Phase52 benchmark
        run: python -m pytest researchos/experiments/phase52/tests/test_prepared_execution.py -k phase52_parallel_matches_sequential_and_reports_timing -s -q

  python-primary:
    name: Python Tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest pytest-cov ruff
          python -m pip install -e ".[dev,test,saas]"
      - name: Verify migration security invariants
        run: python scripts/verify_migrations.py
      - name: Verify SaaS authorization coverage
        run: python scripts/check_authz_coverage.py
      - name: Run ruff
        run: ruff check .
      - name: Run pytest
        run: python -m pytest researchos/tests/ researchos/research_core/tests/ researchos/saas/tests/ -v --tb=short -x --import-mode=importlib --ignore=researchos/tests/test_cpp_backtest_regression.py
      - name: Run production forward-migration governance tests
        run: python -m pytest tests/test_production_forward_migration_governance.py -q
      - name: Run unit contract tests
        run: python -m pytest tests/unit/ -q --import-mode=importlib



  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,test,saas]"
      - name: Run property tests
        run: python -m pytest researchos/tests/test_quality_property_contracts.py -v --tb=short

  quant-engine:
    name: Quant Engine (C++ / nanobind)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nanobind scikit-build-core pytest numpy pandas
      - name: Configure C++ Engine
        run: |
          cmake -S researchos/engines/quant \
            -B researchos/engines/quant/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=ON
      - name: Build C++ Engine
        run: cmake --build researchos/engines/quant/build -j
      - name: Test Python Integration
        env:
          PYTHONPATH: researchos/engines/quant/python
        run: python -m pytest researchos/engines/quant/tests/ -v -x
      - name: Verify C++ regression backend
        env:
          PYTHONPATH: researchos/engines/quant/python
        run: |
          python -c "from researchos.quant_engine.cpp_backend import CppQuantAdapter; e=CppQuantAdapter(); assert e.is_cpp, 'compiled C++ backend is not active'; print(e.get_version())"
          python -m pytest researchos/tests/test_cpp_backtest_regression.py -v --tb=short

  health-evidence:
    name: Health Evidence
    runs-on: ubuntu-24.04
    needs: [python-primary, quant-engine]
    if: always()
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,saas]"
          python -m pip install nanobind scikit-build-core pytest ruff
      - name: Build C++ Engine
        run: |
          cmake -S researchos/engines/quant \
            -B researchos/engines/quant/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=ON
          cmake --build researchos/engines/quant/build -j
      - name: Run health check
        env:
          PYTHONPATH: researchos/engines/quant/python
        run: |
          python -m pytest researchos/tests/ researchos/research_core/tests/ -v --tb=short -x --ignore=researchos/tests/test_cpp_backtest_regression.py
          ruff check .

  quality-static:
    name: Quality Static
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff pyyaml pydantic pandas numpy polars plotly
          python -m pip install fastapi uvicorn python-multipart supabase structlog
          python -m pip install "opentelemetry-api>=1.27,<2" "opentelemetry-sdk>=1.27,<2"
          python -m pip install "prometheus-client>=0.21,<1" "msgpack>=1.2.1,<2" httpx
      - name: Syntax
        run: python -m compileall -q researchos tools
      - name: Undefined names and redefinitions
        run: python -m ruff check researchos --select E9,F82,F811
      - name: Every SaaS module imports
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: smoke-service-role-key
          SUPABASE_ANON_KEY: smoke-anon-key
          QROS_STORAGE_SIGNING_SECRET: smoke-signing-secret
        run: python tools/import_smoke.py researchos.saas
      - name: Workflow hygiene
        run: python tools/check_workflows.py

  release-readiness-static:
    name: Static Release Readiness Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run release-readiness contract audit
        run: python ops/release/readiness_audit.py

  mypy-ratchet:
    name: Mypy Ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,saas]"
          python -m pip install mypy-baseline
      - name: New type errors only
        run: |
          python -m mypy --config-file pyproject.toml --follow-imports=skip | mypy-baseline filter

  full-configured-test-suite:
    name: Full Configured Test Suite + Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,test,saas]"
          python -m pip install pytest-cov
      - name: Build C++ quant backend
        run: |
          cmake -S researchos/engines/quant \
            -B researchos/engines/quant/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=ON
          cmake --build researchos/engines/quant/build -j
      - name: Run every configured test path and enforce coverage floor
        env:
          PYTHONPATH: researchos/engines/quant/python
        run: |
          python -m pytest -q --import-mode=importlib -m "not real_db" \
            --cov=researchos --cov-report=xml:coverage.xml \
            --cov-report=term-missing --cov-fail-under=50 2>&1 | tee coverage.txt
      - name: Upload exact-SHA coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qros-coverage-${{ github.sha }}
          path: |
            coverage.xml
            coverage.txt
          if-no-files-found: warn
          retention-days: 90
