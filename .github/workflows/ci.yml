name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Preserve an independent verification result for every main commit.
# New pushes must not cancel a run already executing for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  # Cancel stale feature/PR runs so a fix does not leave obsolete CI consuming time.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feat/') }}

jobs:
  repository-integrity:
    name: Repository Integrity Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check repository text integrity
        run: python scripts/check_text_integrity.py
      - name: Compile Python sources
        run: python -m compileall -q researchos scripts

  python-primary:
    name: Python Tests
    needs: [repository-integrity]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest pytest-cov ruff
          python -m pip install -e ".[dev,test,saas]"
      - name: Run ruff
        run: ruff check .
      - name: Run pytest
        run: python -m pytest researchos/tests/ researchos/research_core/tests/ researchos/saas/tests/ -v --tb=short -x --import-mode=importlib

  quant-engine:
    name: Quant Engine (C++ / nanobind)
    needs: [repository-integrity]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nanobind scikit-build-core pytest
      - name: Configure C++ Engine
        run: |
          cmake -S researchos/engines/quant \
            -B researchos/engines/quant/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=ON
      - name: Build C++ Engine
        run: cmake --build researchos/engines/quant/build -j
      - name: Test Python Integration
        env:
          PYTHONPATH: researchos/engines/quant/python
        run: python -m pytest researchos/engines/quant/tests/ -v -x

  health-evidence:
    name: Health Evidence
    needs: [repository-integrity, python-primary, quant-engine]
    if: ${{ needs.repository-integrity.result == 'success' && needs.python-primary.result == 'success' && needs.quant-engine.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,saas]"
          python -m pip install nanobind scikit-build-core pytest ruff
      - name: Build C++ Engine
        run: |
          cmake -S researchos/engines/quant \
            -B researchos/engines/quant/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=ON
          cmake --build researchos/engines/quant/build -j
      - name: Run health check
        env:
          PYTHONPATH: researchos/engines/quant/python
        run: |
          python -m pytest researchos/tests/ researchos/research_core/tests/ -v --tb=short -x
          ruff check .
