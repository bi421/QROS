name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "refactor/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-primary:
    name: Python Tests + Coverage (3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install nanobind
          python -m pip install -e ".[dev,test,saas]"
          python -m pip install pytest pytest-cov ruff
      - name: Test + coverage
        run: python -m pytest -v --cov=researchos --cov-report=xml --cov-report=term

  python-compatibility:
    name: Python Compatibility (${{ matrix.python-version }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,saas]"
          python -m pip install pytest pytest-cov
      - name: Compile compatibility surface
        run: python -m compileall -q researchos
      - name: Compatibility smoke tests
        run: >-
          python -m pytest -q
          researchos/tests/test_research_claim.py
          researchos/saas/tests/test_contracts.py
          researchos/saas/tests/test_api.py

  quant-engine:
    name: Quant Engine (C++ / nanobind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install system deps
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 ccache ninja-build
      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,saas]"
          # Deliberate nanobind migration completed.
          python -m pip install "nanobind>=2.0,<4" "cmake>=3.28,<4"
          python -m pip install pytest pytest-cov
      - name: Cache build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.ccache
            researchos/engines/quant/build-nanobind
          key: quant-nanobind-${{ runner.os }}-${{ hashFiles('researchos/engines/quant/CMakeLists.txt', 'researchos/engines/quant/bindings/**/*.cpp', 'researchos/engines/quant/**/*.h', 'pyproject.toml') }}
          restore-keys: quant-nanobind-${{ runner.os }}-
      - name: Configure C++ Quant Engine
        run: |
          cmake -S researchos/engines/quant -B researchos/engines/quant/build-nanobind -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build C++ Quant Engine
        run: cmake --build researchos/engines/quant/build-nanobind -j
      - name: Test C++ Quant Engine
        run: ctest --test-dir researchos/engines/quant/build-nanobind -V
      - name: Test Python Quant Integration
        env:
          PYTHONPATH: researchos/engines/quant/python
        run: python -m pytest researchos/tests/ -k quant -v

  health-evidence:
    name: Health Evidence + Scope Gate
    needs: [python-primary, quant-engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install health-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,saas]"
          python -m pip install pytest ruff nanobind cmake
      - name: Scope guard
        run: python scripts/check_scope.py --base origin/main
      - name: QROS governance guard
        run: python scripts/check_qros_governance.py --base origin/main
      - name: Text integrity guard
        run: python scripts/check_text_integrity.py .github/workflows/ci.yml .pre-commit-config.yaml pyproject.toml
      - name: Run canonical health check
        run: python scripts/final_health_check.py
      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qros-health-${{ github.sha }}
          path: .health/last_run.json
          if-no-files-found: error
          retention-days: 30