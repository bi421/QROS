name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feat/') }}

jobs:
  integrity:
    name: Repository Integrity Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/check_text_integrity.py
      - run: python -m compileall -q researchos scripts
      - run: python scripts/check_migrations.py
      - run: python scripts/verify_authz_routes.py
      - run: python scripts/check_authz_coverage.py
      - run: python scripts/verify_api_contract.py

  type-check:
    name: Mypy Type Check
    needs: [integrity]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[dev,test,saas]"
      - run: python -m mypy researchos/probability researchos/research_core

  test-python:
    name: Python Tests
    needs: [integrity]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install pytest pytest-cov ruff nanobind scikit-build-core cmake -e ".[dev,test,saas]"
      - name: Build C++ backend for canonical regression suite
        if: matrix.python-version == '3.11'
        run: |
          cmake -S researchos/engines/quant -B researchos/engines/quant/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=ON
          cmake --build researchos/engines/quant/build -j
      - run: ruff check .
        if: matrix.python-version == '3.12'
      - name: Test canonical suite
        env:
          PYTHONPATH: researchos/engines/quant/python
        run: python -m pytest researchos/tests/ researchos/research_core/tests/ researchos/saas/tests/ -v --tb=short -x --import-mode=importlib

  build-engine:
    name: Build Quant Engine (nanobind)
    needs: [integrity]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -qq ninja-build cmake g++
      - run: |
          python -m pip install --upgrade pip
          python -m pip install nanobind scikit-build-core pytest
      - name: Build engine
        run: |
          cmake -S researchos/engines/quant \
            -B researchos/engines/quant/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=ON
          cmake --build researchos/engines/quant/build -j
      - name: Test engine integration
        env:
          PYTHONPATH: researchos/engines/quant/python
        run: python -m pytest researchos/engines/quant/tests/ -v -x

  build-container:
    name: Production Container Image
    needs: [test-python, type-check, build-engine]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t qros-api:ci .
      - name: Smoke test health and readiness endpoints
        run: |
          set -euo pipefail
          docker run -d --rm --name qros-api-ci             -p 18000:8000             -e SUPABASE_URL=http://127.0.0.1:54321             -e SUPABASE_SERVICE_ROLE_KEY=ci-smoke-placeholder             qros-api:ci
          trap 'docker stop qros-api-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/healthz >/dev/null               && curl --fail --silent --show-error http://127.0.0.1:18000/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "HTTP health/readiness endpoints passed; verifying Docker HEALTHCHECK contract"
          for attempt in $(seq 1 15); do
            health_status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' qros-api-ci)
            if [ "$health_status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker inspect qros-api-ci
          docker logs qros-api-ci
          exit 1

  test-database:
    name: Tenant Isolation (pgTAP)
    needs: [integrity]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - run: supabase init
      - run: supabase start
      - run: supabase test db supabase/tests/tenant_isolation_test.sql
      - if: always()
        run: supabase stop

  backup-restore-dr:
    name: Backup Restore and DR Verification
    needs: [integrity]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Start isolated Supabase database
        run: |
          supabase init
          supabase start
      - name: Prepare object replication fixture
        run: |
          set -euo pipefail
          mkdir -p .dr-objects/before/datasets .dr-objects/after/datasets
          printf '%s' 'qros-dr-fixture-dataset' > .dr-objects/before/datasets/sample.csv
          cp .dr-objects/before/datasets/sample.csv .dr-objects/after/datasets/sample.csv
      - name: Verify backup restore, migrations, tenant isolation and object hashes
        run: |
          python scripts/backup_verify.py             --source-url 'postgresql://postgres:postgres@127.0.0.1:54322/postgres'             --target-admin-url 'postgresql://postgres:postgres@127.0.0.1:54322/postgres'             --object-root-before .dr-objects/before             --object-root-after .dr-objects/after
      - if: always()
        run: supabase stop

  schema-security:
    name: Fresh Migration and Tenant RLS Contract
    needs: [integrity]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Verify fresh migration replay and tenant RLS
        run: python scripts/verify_migrations.py
      - name: Show schema diff artifact
        if: always()
        run: |
          test ! -f .migration-audit/schema_diff.sql || cat .migration-audit/schema_diff.sql

  ci-complete:
    name: CI Pipeline Complete
    needs: [test-python, type-check, build-engine, build-container, test-database, backup-restore-dr, schema-security]
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - run: echo "All checks passed"
