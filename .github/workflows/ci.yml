name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "refactor/**"
  pull_request:
  workflow_dispatch:

# Keep the PR path fast while preserving the full compatibility matrix on main/manual runs.
# Feature/fix/refactor pushes are validated before a PR is opened.
# New pushes cancel stale PR runs so obsolete commits do not consume runner time.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-primary:
    name: Python Tests + Coverage (3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,saas]"
          python -m pip install pytest pytest-cov ruff
      - name: Test + coverage
        run: python -m pytest -v --cov=researchos --cov-report=xml --cov-report=term

  python-compatibility:
    name: Python Compatibility (${{ matrix.python-version }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,saas]"
          python -m pip install pytest pytest-cov
      - name: Compatibility test
        run: python -m pytest -v

  quant-engine:
    name: Quant Engine (C++ / nanobind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install system deps
        run: |
          sudo grep -RIl 'dl.google.com/linux/chrome' /etc/apt/sources.list.d 2>/dev/null \
            | while read -r source; do sudo mv "$source" "$source.disabled"; done
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 ccache ninja-build
      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,saas]"
          python -m pip install nanobind scikit-build-core cmake
          python -m pip install pytest pytest-cov
      - name: Cache build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.ccache
            researchos/engines/quant/build
          key: quant-${{ runner.os }}-${{ hashFiles('researchos/engines/quant/CMakeLists.txt', 'researchos/engines/quant/**/*.cpp', 'researchos/engines/quant/**/*.h', 'pyproject.toml') }}
          restore-keys: quant-${{ runner.os }}-
      - name: Configure C++ Quant Engine
        run: |
          cmake -S researchos/engines/quant -B researchos/engines/quant/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build C++ Quant Engine
        run: cmake --build researchos/engines/quant/build -j
      - name: Test C++ Quant Engine
        run: ctest --test-dir researchos/engines/quant/build -V
      - name: Benchmark C++ fast path
        env:
          PYTHONPATH: researchos/engines/quant/python
        run: python researchos/engines/quant/benchmarks/bench_fast_numeric.py --rows 1000000 --repeat 3
      - name: Test Python Quant Integration
        env:
          PYTHONPATH: researchos/engines/quant/python
        run: python -m pytest researchos/tests/ -k quant -v

  health-evidence:
    name: Health Evidence + Scope Gate
    needs: [python-primary, quant-engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install health-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,saas]"
          python -m pip install pytest ruff nanobind scikit-build-core cmake
      - name: Scope guard
        run: python scripts/check_scope.py --base origin/main
      - name: Repository truth audit
        id: truth_audit
        continue-on-error: true
        run: python scripts/audit_repository_truth.py
      - name: Upload repository truth audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: researchos-truth-audit-${{ github.sha }}
          path: docs/audits/repository_truth_audit.md
          if-no-files-found: error
          retention-days: 30
      - name: Fail on repository truth findings
        if: steps.truth_audit.outcome == 'failure'
        run: |
          echo "Repository truth audit found findings; audit evidence was uploaded above."
          exit 1
      - name: Text integrity guard
        run: python scripts/check_text_integrity.py .github/workflows/ci.yml .pre-commit-config.yaml pyproject.toml
      - name: Run canonical health check
        run: python scripts/final_health_check.py
      - name: Upload health evidence
        if: always() && hashFiles('.health/last_run.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: researchos-health-${{ github.sha }}
          path: .health/last_run.json
          if-no-files-found: error
          retention-days: 30
