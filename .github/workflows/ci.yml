name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]

# Preserve an independent verification result for every main commit.
# New pushes must not cancel a run already executing for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-primary:
    name: Python Tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest pytest-cov ruff
          python -m pip install -e ".[dev,test,saas]" 2>&1 || true
      - name: Run ruff
        run: ruff check . --exit-zero
      - name: Run pytest
        run: python -m pytest researchos/tests/ researchos/research_core/tests/ researchos/saas/tests/ -v --tb=short -x

  quant-engine:
    name: Quant Engine (C++ / nanobind)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nanobind scikit-build-core pytest
      - name: Configure C++ Engine
        run: |
          cmake -S researchos/engines/quant \
            -B researchos/engines/quant/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=ON
      - name: Build C++ Engine
        run: cmake --build researchos/engines/quant/build -j
      - name: Test Python Integration
        env:
          PYTHONPATH: researchos/engines/quant/python
        run: python -m pytest researchos/engines/quant/tests/ -v -x

  health-evidence:
    name: Health Evidence
    runs-on: ubuntu-24.04
    needs: [python-primary, quant-engine]
    if: always()
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,saas]" 2>&1 || true
          python -m pip install nanobind scikit-build-core pytest ruff
      - name: Build C++ Engine
        run: |
          cmake -S researchos/engines/quant \
            -B researchos/engines/quant/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=ON
          cmake --build researchos/engines/quant/build -j
      - name: Run health check
        env:
          PYTHONPATH: researchos/engines/quant/python
        run: |
          python -m pytest researchos/tests/ researchos/research_core/tests/ -v --tb=short -x
          ruff check . --exit-zero