name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-primary:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff
          python -m pip install -e ".[dev,test,saas]"
      - name: Run pytest
        run: python -m pytest researchos/tests/ -v --tb=short -m "not cpp"
      - name: Run ruff
        run: ruff check .

  quant-engine:
    name: Quant Engine (C++ / nanobind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install and build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,saas]"
      - name: Verify installed native binding
        run: |
          python -c "import cpp_quant_engine; from cpp_quant_engine.backend import native_module; m=native_module(); print('native binding:', m.__name__); print('backend:', m.CppQuantBackend().get_version())"
      - name: Test Python integration
        run: python -m pytest researchos/engines/quant/tests/ -v
      - name: Run C++ adapter regression
        run: python -m pytest researchos/tests/test_cpp_backtest_regression.py -v

  health-evidence:
    name: Health Evidence
    runs-on: ubuntu-latest
    needs: [python-primary, quant-engine]
    steps:
      # Governance compares against github.event.before; full history is required
      # because the default checkout is shallow and may not contain that commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,saas]"
          python -m pip install nanobind scikit-build-core pytest ruff
      - name: Build C++ Engine
        run: |
          cmake -S researchos/engines/quant \
            -B researchos/engines/quant/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=ON
          cmake --build researchos/engines/quant/build -j
      - name: Run QROS governance gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/check_qros_governance.py --base "${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            python scripts/check_qros_governance.py --base "${{ github.event.before }}"
          else
            python scripts/check_qros_governance.py
          fi
      - name: Run canonical health evidence gate
        env:
          PYTHONPATH: researchos/engines/quant/python
        run: python scripts/final_health_check.py
      - name: Upload health evidence
        if: always() && hashFiles('.health/last_run.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: qros-health-${{ github.sha }}
          path: .health/last_run.json
          if-no-files-found: error