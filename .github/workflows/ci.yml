name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  CMAKE_VERSION: "3.27"

jobs:
  python-primary:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,saas]"

      - name: Run pytest
        run: python -m pytest researchos/tests/ -v --tb=short

      - name: Run ruff check
        run: ruff check .

  quant-engine:
    name: Quant Engine (C++ / nanobind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nanobind scikit-build-core

      - name: Configure C++ Quant Engine
        run: |
          cmake -S researchos/engines/quant \
            -B researchos/engines/quant/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=ON

      - name: Build C++ Quant Engine
        run: cmake --build researchos/engines/quant/build -j

      - name: Test Python Quant Integration
        env:
          PYTHONPATH: researchos/engines/quant/python
        run: python -m pytest researchos/engines/quant/tests/ -v

  health-evidence:
    name: Health Evidence
    runs-on: ubuntu-latest
    needs: [python-primary, quant-engine]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,saas]"
          python -m pip install nanobind scikit-build-core

      - name: Build C++ Quant Engine
        run: |
          cmake -S researchos/engines/quant \
            -B researchos/engines/quant/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=ON
          cmake --build researchos/engines/quant/build -j

      - name: Run canonical health check
        env:
          PYTHONPATH: researchos/engines/quant/python
        run: |
          python -m pytest researchos/tests/ -v --tb=short
          ruff check .

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version || '3.11' }}
          path: .pytest_cache/
          retention-days: 7