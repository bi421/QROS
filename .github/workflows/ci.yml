name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep the PR path fast while preserving the full compatibility matrix on main/manual runs.
# New pushes cancel stale PR runs so obsolete commits do not consume runner time.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-primary:
    name: Python Tests + Coverage (3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
          pip install pytest pytest-cov
      - name: Test + coverage
        run: pytest -v --cov=researchos --cov-report=xml --cov-report=term

  python-compatibility:
    name: Python Compatibility (${{ matrix.python-version }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
          pip install pytest pytest-cov
      - name: Compatibility test
        run: pytest -v

  quant-engine:
    name: Quant Engine (C++ / nanobind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install system deps
        run: |
          sudo grep -RIl 'dl.google.com/linux/chrome' /etc/apt/sources.list.d 2>/dev/null \
            | while read -r source; do sudo mv "$source" "$source.disabled"; done
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 ccache ninja-build
      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
          pip install nanobind scikit-build-core cmake
      - name: Cache build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.ccache
            cpp_quant_engine/build
          key: quant-${{ runner.os }}-${{ hashFiles('cpp_quant_engine/CMakeLists.txt', 'cpp_quant_engine/**/*.cpp', 'cpp_quant_engine/**/*.h', 'pyproject.toml') }}
          restore-keys: quant-${{ runner.os }}-
      - name: Configure C++ Quant Engine
        run: |
          cmake -S cpp_quant_engine -B cpp_quant_engine/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build C++ Quant Engine
        run: cmake --build cpp_quant_engine/build -j
      - name: Test C++ Quant Engine
        run: ctest --test-dir cpp_quant_engine/build -V
      - name: Benchmark C++ fast path
        env:
          PYTHONPATH: cpp_quant_engine/python
        run: python cpp_quant_engine/benchmarks/bench_fast_numeric.py --rows 1000000 --repeat 3
      - name: Test Python Quant Integration
        run: pytest researchos/tests/ -k quant -v
