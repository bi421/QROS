name: Production Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19
    environment: production
    timeout-minutes: 30
    env:
      BUCKET: qros-backups
      EXPECTED_PROJECT_REF: pvhdsngxyoiqhqwujfjt   # production Supabase project ref
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKUP_AWS_REGION }}

    # No checkout step: nothing here reads repository files.
    steps:
      - name: Verify tools and secrets
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          command -v docker && command -v aws
          aws --version
          test -n "$PROD_DATABASE_URL"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$AWS_DEFAULT_REGION"

      - name: Guard - correct project and IPv4-reachable host (no secrets printed)
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST="$(echo "$PROD_DATABASE_URL" | sed -E 's#^[a-z]+://[^@]*@([^:/?]+).*#\1#')"
          PORT="$(echo "$PROD_DATABASE_URL" | sed -E 's#^[a-z]+://[^@]*@[^:/?]+:([0-9]+).*#\1#')"
          echo "host=$HOST port=$PORT"
          if ! echo "$PROD_DATABASE_URL" | grep -q "$EXPECTED_PROJECT_REF"; then
            echo "::error::PROD_DATABASE_URL does not point to production project $EXPECTED_PROJECT_REF"
            exit 1
          fi
          if echo "$HOST" | grep -Eq '^db\..*\.supabase\.co$'; then
            echo "::error::Direct host is IPv6-only and unreachable from GitHub runners. Use the Session pooler string (port 5432)."
            exit 1
          fi
          if [ "$PORT" = "6543" ]; then
            echo "::error::Port 6543 is transaction mode; pg_dump needs session mode (5432)."
            exit 1
          fi

      - name: Dump production database (pg_dump 17) and compress
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          FILE="qros-backup-${TS}.sql.gz"
          mkdir -p /tmp/backup
          echo "FILE=$FILE" >> "$GITHUB_ENV"

          docker run --rm -e PGURL="$PROD_DATABASE_URL" postgres:17 \
            sh -c 'pg_dump --no-password "$PGURL"' \
            | gzip -9 > "/tmp/backup/$FILE"

          gzip -t "/tmp/backup/$FILE"
          test -s "/tmp/backup/$FILE"
          ls -l "/tmp/backup/$FILE"

      - name: Generate checksum (relative path)
        run: |
          set -euo pipefail
          cd /tmp/backup
          sha256sum "$FILE" > "$FILE.sha256"
          cat "$FILE.sha256"

      - name: Upload to S3
        run: |
          set -euo pipefail
          aws s3 cp "/tmp/backup/$FILE"        "s3://$BUCKET/daily/$FILE"
          aws s3 cp "/tmp/backup/$FILE.sha256" "s3://$BUCKET/daily/$FILE.sha256"

      - name: Verify objects exist (head-object)
        run: |
          set -euo pipefail
          aws s3api head-object --bucket "$BUCKET" --key "daily/$FILE"
          aws s3api head-object --bucket "$BUCKET" --key "daily/$FILE.sha256"

      - name: Download from S3 and verify integrity
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify
          aws s3 cp "s3://$BUCKET/daily/$FILE"        "/tmp/verify/$FILE"
          aws s3 cp "s3://$BUCKET/daily/$FILE.sha256" "/tmp/verify/$FILE.sha256"
          cd /tmp/verify
          sha256sum --check "$FILE.sha256"
          gzip -t "$FILE"
          echo "BACKUP VERIFIED: s3://$BUCKET/daily/$FILE"

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/backup /tmp/verify
