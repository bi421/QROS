name: Production Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install pg_dump
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify AWS CLI
        run: |
          command -v aws
          aws --version

      - name: Dump production database with pg_dump
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          # GitHub-hosted runners may have no IPv6 route to Supabase's direct
          # database hostname. Keep the hostname in the URL for TLS and resolve
          # an IPv4 address separately for libpq's network target.
          DB_AUTHORITY="${PROD_DATABASE_URL##*@}"
          DB_AUTHORITY="${DB_AUTHORITY%%/*}"
          DB_HOST="${DB_AUTHORITY%%:*}"
          test -n "$DB_HOST"
          DB_IPV4="$(getent ahostsv4 "$DB_HOST" | awk 'NR==1 {print $1}')"
          test -n "$DB_IPV4"
          echo "Resolved production DB hostname to IPv4 for pg_dump."
          PGHOSTADDR="$DB_IPV4" pg_dump --no-password "$PROD_DATABASE_URL" > /tmp/qros-backup.sql

      - name: Generate checksum
        run: |
          sha256sum /tmp/qros-backup.sql > /tmp/backup.sha256

      - name: Upload backup to S3 with aws s3 cp
        env:
          BACKUP_AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          BACKUP_AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          BACKUP_AWS_REGION: ${{ secrets.BACKUP_AWS_REGION }}
        run: |
          aws configure set aws_access_key_id "$BACKUP_AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$BACKUP_AWS_SECRET_ACCESS_KEY"
          aws configure set region "$BACKUP_AWS_REGION"
          aws s3 cp /tmp/qros-backup.sql s3://qros-backups/qros-backup.sql
          aws s3 cp /tmp/backup.sha256 s3://qros-backups/backup.sha256

      - name: Verify backup exists with head-object
        env:
          BACKUP_AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          BACKUP_AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          BACKUP_AWS_REGION: ${{ secrets.BACKUP_AWS_REGION }}
        run: |
          aws configure set aws_access_key_id "$BACKUP_AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$BACKUP_AWS_SECRET_ACCESS_KEY"
          aws configure set region "$BACKUP_AWS_REGION"
          aws s3api head-object --bucket qros-backups --key qros-backup.sql

      - name: Verify checksums with sha256sum --check
        run: |
          cd /tmp
          sha256sum --check backup.sha256

      - name: Cleanup
        if: always()
        run: rm -f /tmp/qros-backup.sql /tmp/backup.sha256
