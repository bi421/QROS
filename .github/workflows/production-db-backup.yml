name: Production Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install pg_dump
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify AWS CLI
        run: |
          command -v aws
          aws --version

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BACKUP_AWS_ROLE_ARN }}
          aws-region: ${{ vars.BACKUP_AWS_REGION }}

      - name: Validate production backup configuration
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PRODUCTION_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
          BACKUP_AWS_ROLE_ARN: ${{ vars.BACKUP_AWS_ROLE_ARN }}
          BACKUP_AWS_REGION: ${{ vars.BACKUP_AWS_REGION }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail
          test -n "${PROD_DATABASE_URL}" || { echo "::error::PROD_DATABASE_URL is not configured"; exit 1; }
          test -n "${PRODUCTION_PROJECT_ID}" || { echo "::error::PRODUCTION_PROJECT_ID is not configured"; exit 1; }
          test -n "${BACKUP_AWS_ROLE_ARN}" || { echo "::error::BACKUP_AWS_ROLE_ARN repository variable is not configured"; exit 1; }
          test -n "${BACKUP_AWS_REGION}" || { echo "::error::BACKUP_AWS_REGION repository variable is not configured"; exit 1; }
          test -n "${BACKUP_S3_BUCKET}" || { echo "::error::BACKUP_S3_BUCKET is not configured"; exit 1; }
          case "${PROD_DATABASE_URL}" in
            *"${PRODUCTION_PROJECT_ID}"*) ;;
            *) echo "::error::production database URL does not identify governed project ${PRODUCTION_PROJECT_ID}"; exit 1 ;;
          esac

      - name: Dump production database and capture source identity
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          DB_AUTHORITY="${PROD_DATABASE_URL##*@}"
          DB_AUTHORITY="${DB_AUTHORITY%%/*}"
          DB_HOST="${DB_AUTHORITY%%:*}"
          test -n "${DB_HOST}"
          DB_IPV4="$(getent ahostsv4 "${DB_HOST}" | awk 'NR==1 {print $1}')"
          test -n "${DB_IPV4}"
          echo "Resolved production DB hostname to IPv4 for libpq."
          PGHOSTADDR="${DB_IPV4}" psql "${PROD_DATABASE_URL}" -At -F $'\t' -v ON_ERROR_STOP=1 -c "select current_database(), current_user, current_setting('server_version'), inet_server_addr()::text;" > /tmp/source_identity.tsv
          test -s /tmp/source_identity.tsv
          IFS=$'\t' read -r SOURCE_DATABASE SOURCE_USER SOURCE_VERSION SOURCE_SERVER_IP < /tmp/source_identity.tsv
          test -n "${SOURCE_DATABASE}"
          test -n "${SOURCE_VERSION}"
          PGHOSTADDR="${DB_IPV4}" pg_dump --no-password --format=custom --no-owner --file /tmp/qros-backup.dump "${PROD_DATABASE_URL}"
          test -s /tmp/qros-backup.dump
          sha256sum /tmp/qros-backup.dump > /tmp/qros-backup.dump.sha256
          stat --format='%s' /tmp/qros-backup.dump > /tmp/qros-backup.size

      - name: Create machine-readable evidence manifest
        env:
          PRODUCTION_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: ${{ secrets.BACKUP_S3_PREFIX }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          backup = Path('/tmp/qros-backup.dump')
          digest = hashlib.sha256(backup.read_bytes()).hexdigest()
          source = Path('/tmp/source_identity.tsv').read_text(encoding='utf-8').strip().split('\t')
          if len(source) != 4 or not source[0] or not source[2]:
              raise SystemExit('source database identity is incomplete')
          timestamp = datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          run_id = os.environ['GITHUB_RUN_ID']
          prefix = os.environ.get('BACKUP_S3_PREFIX', 'qros/production').strip('/')
          key_prefix = f'{prefix}/{timestamp}-{run_id}'
          manifest = {
              'schema_version': 1, 'status': 'CREATED', 'environment': 'production',
              'repository': 'bi421/QROS', 'workflow': 'Production Database Backup',
              'github_run_id': run_id, 'github_sha': os.environ['GITHUB_SHA'],
              'created_at_utc': datetime.now(timezone.utc).isoformat(),
              'production_project_id': os.environ['PRODUCTION_PROJECT_ID'],
              'source_database': source[0], 'source_user': source[1],
              'postgres_version': source[2], 'source_server_ip': source[3],
              'backup': {'object_key': f'{key_prefix}/qros-backup.dump', 'sha256': digest,
                         'bytes': backup.stat().st_size, 'format': 'custom'},
              'checksum_object_key': f'{key_prefix}/qros-backup.dump.sha256',
              'manifest_object_key': f'{key_prefix}/manifest.json',
              'remote_verification': {'head_object': False, 'downloaded_checksum_match': False,
                                      'version_id_present': False},
          }
          Path('/tmp/backup-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          for filename, key in [('backup-object-key', manifest['backup']['object_key']), ('backup-checksum-key', manifest['checksum_object_key']), ('backup-manifest-key', manifest['manifest_object_key'])]:
              Path('/tmp/'+filename).write_text(key+'\n', encoding='utf-8')
          PY
          cat /tmp/backup-manifest.json

      - name: Upload backup, checksum, and evidence manifest
        env:
          BACKUP_AWS_ROLE_ARN: ${{ vars.BACKUP_AWS_ROLE_ARN }}
          BACKUP_AWS_REGION: ${{ vars.BACKUP_AWS_REGION }}
          BACKUP_AWS_ENDPOINT_URL: ${{ secrets.BACKUP_AWS_ENDPOINT_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail
          ENDPOINT_ARGS=(); if [ -n "${BACKUP_AWS_ENDPOINT_URL:-}" ]; then ENDPOINT_ARGS+=(--endpoint-url "${BACKUP_AWS_ENDPOINT_URL}"); fi
          aws s3 cp /tmp/qros-backup.dump "s3://${BACKUP_S3_BUCKET}/$(cat /tmp/backup-object-key)" "${ENDPOINT_ARGS[@]}"
          aws s3 cp /tmp/qros-backup.dump.sha256 "s3://${BACKUP_S3_BUCKET}/$(cat /tmp/backup-checksum-key)" "${ENDPOINT_ARGS[@]}"
          aws s3 cp /tmp/backup-manifest.json "s3://${BACKUP_S3_BUCKET}/$(cat /tmp/backup-manifest-key)" "${ENDPOINT_ARGS[@]}"

      - name: Verify remote objects with HEAD and version identity
        env:
          BACKUP_AWS_ROLE_ARN: ${{ vars.BACKUP_AWS_ROLE_ARN }}
          BACKUP_AWS_REGION: ${{ vars.BACKUP_AWS_REGION }}
          BACKUP_AWS_ENDPOINT_URL: ${{ secrets.BACKUP_AWS_ENDPOINT_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail
          ENDPOINT_ARGS=(); if [ -n "${BACKUP_AWS_ENDPOINT_URL:-}" ]; then ENDPOINT_ARGS+=(--endpoint-url "${BACKUP_AWS_ENDPOINT_URL}"); fi
          HEAD="$(aws s3api head-object --bucket "${BACKUP_S3_BUCKET}" --key "$(cat /tmp/backup-object-key)" --query '[ContentLength,VersionId]' --output text "${ENDPOINT_ARGS[@]}")"
          CHECKSUM_HEAD="$(aws s3api head-object --bucket "${BACKUP_S3_BUCKET}" --key "$(cat /tmp/backup-checksum-key)" --query '[ContentLength,VersionId]' --output text "${ENDPOINT_ARGS[@]}")"
          MANIFEST_HEAD="$(aws s3api head-object --bucket "${BACKUP_S3_BUCKET}" --key "$(cat /tmp/backup-manifest-key)" --query '[ContentLength,VersionId]' --output text "${ENDPOINT_ARGS[@]}")"
          echo "backup HEAD: ${HEAD}"
          echo "checksum HEAD: ${CHECKSUM_HEAD}"
          echo "manifest HEAD: ${MANIFEST_HEAD}"
          read -r REMOTE_SIZE REMOTE_VERSION <<< "${HEAD}"
          test "${REMOTE_SIZE}" -gt 0
          test -n "${REMOTE_VERSION}" && test "${REMOTE_VERSION}" != 'None'
          printf '%s\n' "${REMOTE_VERSION}" > /tmp/backup-version-id

      - name: Download remote backup and verify checksum equality
        env:
          BACKUP_AWS_ROLE_ARN: ${{ vars.BACKUP_AWS_ROLE_ARN }}
          BACKUP_AWS_REGION: ${{ vars.BACKUP_AWS_REGION }}
          BACKUP_AWS_ENDPOINT_URL: ${{ secrets.BACKUP_AWS_ENDPOINT_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail
          ENDPOINT_ARGS=(); if [ -n "${BACKUP_AWS_ENDPOINT_URL:-}" ]; then ENDPOINT_ARGS+=(--endpoint-url "${BACKUP_AWS_ENDPOINT_URL}"); fi
          aws s3 cp "s3://${BACKUP_S3_BUCKET}/$(cat /tmp/backup-object-key)" /tmp/remote-qros-backup.dump "${ENDPOINT_ARGS[@]}"
          aws s3 cp "s3://${BACKUP_S3_BUCKET}/$(cat /tmp/backup-checksum-key)" /tmp/remote-qros-backup.dump.sha256 "${ENDPOINT_ARGS[@]}"
          test -s /tmp/remote-qros-backup.dump
          test -s /tmp/remote-qros-backup.dump.sha256
          (cd /tmp && sha256sum --check remote-qros-backup.dump.sha256)
          LOCAL_DIGEST="$(cut -d' ' -f1 /tmp/qros-backup.dump.sha256)"
          REMOTE_DIGEST="$(cut -d' ' -f1 /tmp/remote-qros-backup.dump.sha256)"
          test "${LOCAL_DIGEST}" = "${REMOTE_DIGEST}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/backup-manifest.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          m['status']='VERIFIED'
          m['remote_verification']={'head_object':True,'downloaded_checksum_match':True,'version_id_present':True,'version_id':Path('/tmp/backup-version-id').read_text(encoding='utf-8').strip()}
          p.write_text(json.dumps(m, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY
          echo 'Production backup evidence verified.'

      - name: Upload verified manifest and re-verify it
        if: success()
        env:
          BACKUP_AWS_ROLE_ARN: ${{ vars.BACKUP_AWS_ROLE_ARN }}
          BACKUP_AWS_REGION: ${{ vars.BACKUP_AWS_REGION }}
          BACKUP_AWS_ENDPOINT_URL: ${{ secrets.BACKUP_AWS_ENDPOINT_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail
          ENDPOINT_ARGS=(); if [ -n "${BACKUP_AWS_ENDPOINT_URL:-}" ]; then ENDPOINT_ARGS+=(--endpoint-url "${BACKUP_AWS_ENDPOINT_URL}"); fi
          MANIFEST_KEY="$(cat /tmp/backup-manifest-key)"
          aws s3 cp /tmp/backup-manifest.json "s3://${BACKUP_S3_BUCKET}/${MANIFEST_KEY}" "${ENDPOINT_ARGS[@]}"
          aws s3api head-object --bucket "${BACKUP_S3_BUCKET}" --key "${MANIFEST_KEY}" "${ENDPOINT_ARGS[@]}"

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/qros-backup.dump /tmp/qros-backup.dump.sha256 /tmp/qros-backup.size
          rm -f /tmp/remote-qros-backup.dump /tmp/remote-qros-backup.dump.sha256
          rm -f /tmp/backup-manifest.json /tmp/backup-object-key /tmp/backup-checksum-key
          rm -f /tmp/backup-manifest-key /tmp/backup-version-id /tmp/source_identity.tsv
