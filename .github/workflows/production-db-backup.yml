name: Production Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install pg_dump
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify tools
        run: |
          set -euo pipefail
          command -v pg_dump
          pg_dump --version
          command -v aws
          aws --version

      - name: Dump production database with pg_dump
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail

          test -n "$PROD_DATABASE_URL"

          pg_dump \
            --no-password \
            "$PROD_DATABASE_URL" \
            > /tmp/qros-backup.sql

          test -s /tmp/qros-backup.sql

      - name: Generate checksum
        run: |
          set -euo pipefail
          sha256sum /tmp/qros-backup.sql > /tmp/backup.sha256
          cat /tmp/backup.sha256

      - name: Configure AWS credentials
        env:
          BACKUP_AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          BACKUP_AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          BACKUP_AWS_REGION: ${{ secrets.BACKUP_AWS_REGION }}
        run: |
          set -euo pipefail

          test -n "$BACKUP_AWS_ACCESS_KEY_ID"
          test -n "$BACKUP_AWS_SECRET_ACCESS_KEY"
          test -n "$BACKUP_AWS_REGION"

          aws configure set aws_access_key_id \
            "$BACKUP_AWS_ACCESS_KEY_ID"

          aws configure set aws_secret_access_key \
            "$BACKUP_AWS_SECRET_ACCESS_KEY"

          aws configure set region \
            "$BACKUP_AWS_REGION"

      - name: Upload backup to S3
        run: |
          set -euo pipefail

          aws s3 cp \
            /tmp/qros-backup.sql \
            s3://qros-backups/qros-backup.sql

          aws s3 cp \
            /tmp/backup.sha256 \
            s3://qros-backups/backup.sha256

      - name: Verify backup exists with head-object
        run: |
          set -euo pipefail

          aws s3api head-object \
            --bucket qros-backups \
            --key qros-backup.sql

          aws s3api head-object \
            --bucket qros-backups \
            --key backup.sha256

      - name: Download uploaded backup for integrity verification
        run: |
          set -euo pipefail

          aws s3 cp \
            s3://qros-backups/qros-backup.sql \
            /tmp/qros-backup.remote.sql

          aws s3 cp \
            s3://qros-backups/backup.sha256 \
            /tmp/backup.remote.sha256

          test -s /tmp/qros-backup.remote.sql
          test -s /tmp/backup.remote.sha256

      - name: Verify uploaded backup checksum
        run: |
          set -euo pipefail

          EXPECTED="$(
            cut -d' ' -f1 /tmp/backup.remote.sha256
          )"

          ACTUAL="$(
            sha256sum /tmp/qros-backup.remote.sql |
            cut -d' ' -f1
          )"

          echo "Expected SHA256: $EXPECTED"
          echo "Actual SHA256:   $ACTUAL"

          test "$EXPECTED" = "$ACTUAL"

      - name: Verify checksum manifest
        run: |
          set -euo pipefail

          cd /tmp
          sha256sum --check backup.remote.sha256

      - name: Cleanup
        if: always()
        run: |
          rm -f \
            /tmp/qros-backup.sql \
            /tmp/backup.sha256 \
            /tmp/qros-backup.remote.sql \
            /tmp/backup.remote.sha256
