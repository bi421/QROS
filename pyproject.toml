[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchos"
version = "0.1.0"
description = "Evidence-driven financial research and quantitative analysis system"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["researchos*", "cpp_quant_engine*"]

[tool.setuptools.package-dir]
financial_research_lab = "financial_research_lab/src/financial_research_lab"

[tool.pytest.ini_options]
addopts = "-v --tb=short --ignore=researchos/tests/test_cpp_backtest_regression.py --ignore=cpp_quant_engine"
testpaths = [
    "tests",
    "researchos/tests",
    "researchos/engines/data/tests",
    "researchos/engines/quant/tests",
    "researchos/memory/tests",
    "researchos/experiments/phase52_rebuild/tests",
    "financial_research_lab/tests",
]
