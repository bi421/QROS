
[tool.mypy]
python_version = "3.12"
strict = true
exclude = [
    "build-nanobind/",
    ".*_deps/",
    "\\.venv",
    "venv",
    "archive",
]

[tool.ruff]
exclude = ["archive", "build-nanobind", ".venv", "venv"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]
"researchos/tests/**" = ["E402"]
"researchos/**/tests/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.bandit]
exclude_dirs = ["tests", "archive", "build-nanobind", ".venv", "venv"]
skips = []
