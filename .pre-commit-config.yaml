repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=5120]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: mypy-strict
        name: mypy strict (researchos)
        entry: python -m mypy --strict researchos
        language: system
        pass_filenames: false
      - id: bandit
        name: bandit security scan
        entry: python -m bandit -r researchos -c pyproject.toml
        language: system
        pass_filenames: false
      - id: check-env-files
        name: reject environment files
        entry: python scripts/check_env_files.py
        language: system
        pass_filenames: false
      - id: researchos-text-integrity
        name: ResearchOS text integrity (no BOM / trailing whitespace)
        entry: python scripts/check_text_integrity.py
        language: system
        pass_filenames: true
      - id: researchos-scope-guard
        name: ResearchOS scope guard
        entry: python scripts/check_scope.py --staged
        language: system
        pass_filenames: false
