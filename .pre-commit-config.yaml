repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        exclude: ^data/mt5/xauusd/XAUUSD_M1_2021_2025_MT5\.zip$

  - repo: local
    hooks:
      - id: researchos-text-integrity
        name: ResearchOS UTF-8/BOM integrity
        entry: python scripts/check_text_integrity.py
        language: system
        pass_filenames: true
        types: [text]
